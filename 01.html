<script>
(function() {
  var baseUrl = window.location.href.replace(/\/[^\/]*$/, '/');
  document.addEventListener('DOMContentLoaded', function() {
    var links = document.querySelectorAll('a[href]');
    links.forEach(function(link) {
      var href = link.getAttribute('href');
      if (href && !href.match(/^(https?:|mailto:|tel:|#|javascript:)/)) {
        link.setAttribute('href', baseUrl + href);
      }
    });
  });
})();
</script>

<style>

<script>
function isMobile() { return window.innerWidth <= 600; }
var dailyTrendChart = echarts.init(document.getElementById('dailyTrendChart'));
dailyTrendChart.setOption({
  tooltip: { trigger: 'axis', formatter: function(p) { return p[0].name + '<br/>' + p.map(function(s){ return s.marker + s.seriesName + ': ' + s.value + '万'; }).join('<br/>'); } },
  legend: { data: ["日营收", "均值"], top: 5, textStyle: { fontSize: isMobile() ? 10 : 12 } },
  grid: { left: isMobile() ? 40 : 50, right: isMobile() ? 15 : 30, bottom: 35, top: 45 },
  xAxis: { type: 'category', data: ["1/1"], axisLabel: { fontSize: isMobile() ? 10 : 11 } },
  yAxis: { type: 'value', name: '万元', min: 45, max: 55, axisLabel: { formatter: '{value}', fontSize: isMobile() ? 10 : 11 } },
  series: [
    { name: '日营收', type: 'bar', data: [50.0],
      itemStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: '#4285f4' }, { offset: 1, color: '#1a73e8' }]), borderRadius: [4, 4, 0, 0] },
      barMaxWidth: 30,
      label: { show: !isMobile(), position: 'top', fontSize: 9, formatter: '{c}' }
    },
    { name: '均值', type: 'line', data: [50.0],
      smooth: true, symbol: 'circle', symbolSize: isMobile() ? 4 : 6,
      lineStyle: { width: 2, type: 'dashed', color: '#ea4335' },
      itemStyle: { color: '#ea4335' }
    }
  ]
});
var deptChartM = echarts.init(document.getElementById('deptChartM'));
deptChartM.setOption({
  tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
  grid: { left: isMobile() ? 80 : 100, right: isMobile() ? 50 : 40, bottom: 20, top: 10 },
  xAxis: { type: 'value', name: '万元', axisLabel: { formatter: '{value}', fontSize: isMobile() ? 10 : 11 } },
  yAxis: { type: 'category', data: [], axisLabel: { fontSize: isMobile() ? 10 : 12 } },
  series: [{
    type: 'bar', barWidth: isMobile() ? 14 : 18, data: [],
    itemStyle: { borderRadius: [0, 4, 4, 0], color: function(p) {
      var colors = ['#0d47a1','#174ea6','#1967d2','#1a73e8','#1a73e8','#1a73e8','#4285f4','#669df6','#8ab4f8','#aecbfa'];
      return colors[p.dataIndex] || '#1a73e8';
    } },
    label: { show: true, position: 'right', formatter: function(p) { return p.value + '万(' + (p.value / 50.0 * 100).toFixed(1) + '%)'; }, fontSize: isMobile() ? 9 : 11 }
  }]
});
var structChartM = echarts.init(document.getElementById('structChartM'));
structChartM.setOption({
  tooltip: { trigger: 'item', formatter: '{b}: {c}万 ({d}%)' },
  legend: { orient: isMobile() ? 'horizontal' : 'vertical', left: isMobile() ? 'center' : 'auto', right: isMobile() ? 'auto' : 10, bottom: isMobile() ? 5 : 'auto', top: isMobile() ? 'auto' : 'center', textStyle: { fontSize: isMobile() ? 10 : 11 } },
  series: [{ type: 'pie', radius: ['35%', '65%'], center: isMobile() ? ['50%', '40%'] : ['35%', '50%'], label: { show: false },
    data: [
      { value: 0, name: '药品', itemStyle: { color: '#1a73e8' } },
      { value: 0, name: '耗材', itemStyle: { color: '#4285f4' } },
      { value: 0, name: '检查', itemStyle: { color: '#34a853' } },
      { value: 0, name: '治疗', itemStyle: { color: '#fbbc04' } },
      { value: 0, name: '其他', itemStyle: { color: '#9aa0a6' } }
    ]
  }]
});
window.addEventListener('resize', function() { dailyTrendChart.resize(); deptChartM.resize(); structChartM.resize(); });
</script>
